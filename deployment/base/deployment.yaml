apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  labels:
    app: auth-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "webapp"
        vault.hashicorp.com/auth-path: "auth/kubernetes-rriv"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-requests-memory: "32Mi"
        vault.hashicorp.com/agent-limits-cpu: "500m"
        vault.hashicorp.com/agent-limits-memory: "128Mi"
        vault.hashicorp.com/secret-volume-path: "/app/config"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/auth-api-creds"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/data/auth-api-creds" }}
          OPENFGA_STORE_ID="{{ .Data.data.openfga_store_id }}"
          OPENFGA_MODEL_ID="{{ .Data.data.openfga_model_id }}"
          {{ end }}
    spec:
      serviceAccountName: internal-app
      imagePullSecrets:
        - name: registry-rriv
      containers:
        - name: auth-api
          command: ["dist/index.js"]
          image: registry.digitalocean.com/rriv/auth-api:1.0.5
          ports:
            - containerPort: 3006
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
