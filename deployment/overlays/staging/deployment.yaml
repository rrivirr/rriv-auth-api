apiVersion: apps/v1
kind: Deployment
metadata:
  name: rriv-api
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject-secret-credentials.txt: "secret/data/staging-auth-api-creds"
        vault.hashicorp.com/agent-inject-template-credentials: |
          {{ with secret "secret/data/staging-auth-api-creds" }}
          OPENFGA_STORE_ID="{{ .Data.data.openfga_store_id }}"
          OPENFGA_MODEL_ID="{{ .Data.data.openfga_model_id }}"
          {{ end }}
    spec:
      containers:
        - name: rriv-api
          env:
            - name: KEYCLOAK_URL
              value: https://auth.staging.rriv.org
            - name: KEYCLOAK_REALM
              value: rriv-beta-staging
            - name: OPENFGA_URL
              value: http://rriv-openfga:8080
