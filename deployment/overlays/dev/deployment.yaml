apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
spec:
  template:
    spec:
      containers:
        - name: auth-api
          env:
            - name: KEYCLOAK_URL
              value: https://auth.dev.rriv.org
            - name: KEYCLOAK_REALM
              value: rriv-beta-dev
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 384Mi
